disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - identifier_name
  # Rules newly enabled-by-default by recent SwiftLint releases. They fire on
  # patterns that already appear throughout the codebase (e.g. `var x: T?`
  # without an explicit `= nil`); leaving them on breaks CI on every PR. Opt
  # any of these back in deliberately if we want to clean the codebase to
  # match.
  - implicit_optional_initialization
  - static_over_final_class
  - unneeded_synthesized_initializer
  - prefer_type_checking
  - redundant_sendable
  - non_optional_string_data_conversion
  - optional_data_string_conversion

opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping

excluded:
  - .build
  - DerivedData
  - Pods

identifier_name:
  min_length: 1
  excluded:
    - id
    - db
    - to
    - _body

nesting:
  type_level: 2

cyclomatic_complexity:
  warning: 15
  error: 25
